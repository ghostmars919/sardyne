[project]
name = "sardyne"
version = "0.0.1"
description = "Motore di inferenza LLM open-weight (Python + C, CPU)"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)"]
dependencies = ["numpy>=1.24", "regex", "jinja2"]

[project.optional-dependencies]
dev = ["pytest>=7", "safetensors", "tokenizers", "huggingface_hub", "httpx", "openai"]
server = ["fastapi", "uvicorn"]
# solo per i confronti con HF nei test (installare torch da https://download.pytorch.org/whl/cpu):
ref = ["torch", "transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sardyne*"]
