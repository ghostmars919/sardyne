[project]
name = "llm-engine"
version = "0.0.1"
description = "Motore di inferenza LLM open-weight (Python + C, CPU)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "safetensors", "tokenizers", "jinja2"]
# solo per confronti nei test (pesanti):
ref = ["torch", "transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
